<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada — SIGNA</title>

  <!-- caminhos absolutos: o 404 pode aparecer em qualquer rota, até /a/b/c -->
  <link rel="stylesheet" href="/static/css/global.css" />
  <link rel="stylesheet" href="/static/css/header.css" />
  <link rel="stylesheet" href="/static/css/footer.css" />
  <link rel="stylesheet" href="/static/css/404.css" />
</head>

<body>

  <div id="app"></div>

  <main class="erro-page">
    <section class="erro">
      <div class="brilho brilho--esquerda"></div>
      <div class="brilho brilho--direita"></div>

      <div class="erro-conteudo">
        <span class="erro-codigo">404</span>
        <h1>Página não encontrada</h1>
        <p>
          Parece que esse sinal não existe por aqui. A página que você procura
          pode ter mudado de endereço ou nunca ter existido.
        </p>

        <div class="botoes">
          <a href="/" class="btn-principal">
            <div class="btn-content">
              <span>Voltar para o início</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M4.16699 10H15.8337" stroke="white" stroke-width="1.66667" stroke-linecap="round"
                  stroke-linejoin="round" />
                <path d="M10 4.16675L15.8333 10.0001L10 15.8334" stroke="white" stroke-width="1.66667"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
          </a>
          <a href="/tradutor" class="btn-secundario">Ir para o Tradutor</a>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/js/components/icons.js"></script>
  <script src="/static/js/components/header.js"></script>
  <script src="/static/js/components/footer.js"></script>
  <script src="/static/js/pages/404.js"></script>

</body>
</html>
