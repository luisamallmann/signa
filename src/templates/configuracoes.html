<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações — SIGNA</title>

  <link rel="stylesheet" href="../static/css/global.css" />
  <link rel="stylesheet" href="../static/css/header.css" />
  <link rel="stylesheet" href="../static/css/footer.css" />
  <link rel="stylesheet" href="../static/css/configuracoes.css" />
</head>

<body>

  <div id="app"></div>

  <main class="config-page">

    <section class="config-hero">
      <h1>Configurações</h1>
      <p>Personalize sua experiência no Signa</p>
    </section>

    
    <section class="config-lista">

      <div class="config-item config-item--destaque">
        <div class="config-item-esquerda">
          <div class="config-icone config-icone--roxo">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="config-texto">
            <span class="config-titulo-item">Notificações</span>
            <span class="config-subtitulo-item">Gerencie suas notificações</span>
            <div class="config-sub-opcao">
              <span>Ativar Notificações</span>
              <span class="config-desc">Receba atualizações e contatos</span>
            </div>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" checked />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <a href="#" class="config-item">
        <div class="config-item-esquerda">
          <div class="config-icone config-icone--roxo">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="7" r="4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="config-texto">
            <span class="config-titulo-item">Conta</span>
            <span class="config-subtitulo-item">Gerencie suas informações pessoais</span>
          </div>
        </div>
        <svg class="config-seta" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M9 18l6-6-6-6" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <a href="#" class="config-item">
        <div class="config-item-esquerda">
          <div class="config-icone config-icone--roxo">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="22,6 12,13 2,6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="config-texto">
            <span class="config-titulo-item">Email</span>
            <span class="config-subtitulo-item">usuario@email.com</span>
          </div>
        </div>
        <svg class="config-seta" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M9 18l6-6-6-6" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <a href="#" class="config-item">
        <div class="config-item-esquerda">
          <div class="config-icone config-icone--roxo">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="config-texto">
            <span class="config-titulo-item">Senha</span>
            <span class="config-subtitulo-item">••••••••</span>
          </div>
        </div>
        <svg class="config-seta" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M9 18l6-6-6-6" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <a href="privacidade.html" class="config-item">
        <div class="config-item-esquerda">
          <div class="config-icone config-icone--roxo">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="config-texto">
            <span class="config-titulo-item">Privacidade</span>
            <span class="config-subtitulo-item">Configurações de privacidade</span>
          </div>
        </div>
        <svg class="config-seta" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M9 18l6-6-6-6" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

    </section>

  </main>

  <script src="../static/js/components/icons.js"></script>
  <script src="../static/js/components/header.js"></script>
  <script src="../static/js/components/footer.js"></script>
  <script src="../static/js/pages/configuracoes.js"></script>

</body>
</html>
