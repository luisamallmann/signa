    <section class="contato">
      <div class="title">
        <h1>Envie sua Mensagem</h1>
        <p>Preencha o Formulário</p>
      </div>
      <form method="POST" class="contact-form">
        <label class="form-label" for="nome">Nome Completo</label>
        <input class="form-input" name="nome" placeholder="Seu nome" required>

        <div class="form-line">
          <div class="form-small-container">
            <label class="form-label" for="email">Email</label>
            <input class="form-input-small" name="email" placeholder="seu@email.com" required>
          </div>
          <div class="form-small-container">
            <label class="form-label" for="email">Assunto</label>
            <select class="form-select" name="assunto" placeholder="Selecionar assunto" required>
              <option value="" disabled selected>Selecionar assunto</option>
              <option value="1">Problemas de tradução</option>
              <option value="2">Problemas de desempenho</option>
              <option value="3">Sugestão</option>
              <option value="4">Outro</option>
            </select>
          </div>
        </div>

        <label class="form-label" for="mensagem">Mensagem</label>
        <textarea class="form-text" name="mensagem" rows="5" cols="40" placeholder="Digite aqui..." required></textarea>
        <button class="form-btn" type="submit">
          <div class="btn-content">
            <span>Enviar Mensagem</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M4.16675 10H15.8334" stroke="#8A38F5" stroke-width="1.66667" stroke-linecap="round"
                stroke-linejoin="round" />
              <path d="M10 4.16675L15.8333 10.0001L10 15.8334" stroke="#8A38F5" stroke-width="1.66667"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
        </button>
      </form>
    </section>
