<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../static/css/global.css" />
    <link rel="stylesheet" href="../static/css/auth.css">
    <link rel="stylesheet" href="../static/css/header.css" />
    <link rel="stylesheet" href="../static/css/footer.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app"></div>

    <section class="auth-section">
        <img class="auth-img" src="../static/assets/images/mão.png" alt="mão-libras">

        <div class="container-right">
            <div>
                <h1>Entrar</h1>
                <p>Faça login para continuar</p>
            </div>
            <form id="form-login">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                <span class="erro" id="erro-email"></span>

                <label for="senha">Senha</label>
                <div>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>
                <span class="erro" id="erro-senha"></span>

                <a href="">Esqueceu a senha?</a>

                <button type="submit">Entrar</button>
            </form>
        </div>
    </section>

    <script src="../static/js/components/icons.js"></script>
    <script src="../static/js/components/header.js"></script>
    <script src="../static/js/components/footer.js"></script>
    <script src="../static/js/pages/login.js"></script>
</body>

</html>
