<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../static/css/global.css" />
    <link rel="stylesheet" href="../static/css/auth.css">
    <link rel="stylesheet" href="../static/css/header.css" />
    <link rel="stylesheet" href="../static/css/footer.css" />
</head>

<body>
    <div id="app"></div>

    <section class="auth-section">
        <div class="auth-img-container">
            <img class="auth-img" src="../static/assets/images/mão.png" alt="mão-libras">
        </div>

        <div class="container-right">
            <div class="auth-header">
                <h1 class="auth-title">Entrar</h1>
                <p class="auth-subtitle">Faça login para continuar</p>
            </div>
            <form method="POST" class="auth-form">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-input" name="email" placeholder="seu@email.com" required>
                {% if erro_email %}
                <div class="error-message">
                    {{ erro_email }}
                </div>
                {% endif %}

                <label class="form-label" for="senha">Senha</label>
                <div>
                    <input type="password" class="form-input" name="senha" placeholder="••••••••" required>
                </div>
                {% if erro_senha %}
                <div class="error-message">
                    {{ erro_senha }}
                </div>
                {% endif %}

                <div class="line-check">
                    <div class="checkbox-wrapper-4">
                        <input class="inp-cbx" id="lembrar" type="checkbox" />
                        <label class="cbx" for="lembrar"><span>
                                <svg width="12px" height="10px">
                                    <use xlink:href="#check-4"></use>
                                </svg></span><span class="line-label">Lembrar de mim</span></label>
                        <svg class="inline-svg">
                            <symbol id="check-4" viewbox="0 0 12 10">
                                <polyline points="1.5 6 4.5 9 10.5 1"></polyline>
                            </symbol>
                        </svg>
                </div>
                <a class="link" href="">Esqueceu a senha?</a>
        </div>

        <button class="form-auth-btn" type="submit">
            <div class="btn-content">
                <span>Entrar</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M4.16675 10H15.8334" stroke="#8A38F5" stroke-width="1.66667" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M10 4.16675L15.8333 10.0001L10 15.8334" stroke="#8A38F5" stroke-width="1.66667"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
        </button>
        </form>
        <div class="line">
            <div class="horizontal-line"></div>
            <p class="line-label">Ou continue com</p>
            <div class="horizontal-line"></div>
        </div>

        <div class="auth-btn-container">
            <button class="auth-btn" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path
                        d="M14.8233 4.2567C13.516 3.15877 11.8732 2.53972 10.1664 2.50185C8.45959 2.46397 6.79095 3.00954 5.43619 4.0484C4.08143 5.08726 3.12164 6.55723 2.71541 8.21542C2.30919 9.87361 2.48085 11.6208 3.20202 13.1682C3.92319 14.7156 5.15072 15.9707 6.68176 16.726C8.21279 17.4813 9.95571 17.6917 11.6225 17.3224C13.2893 16.9531 14.7802 16.0261 15.8489 14.6948C16.9175 13.3634 17.5 11.7073 17.5 10H10.8333"
                        stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Google</button>
            <button class="auth-btn" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path
                        d="M10.2119 4.39362C10.0995 4.39362 9.99167 4.34905 9.91207 4.26968C9.83246 4.19031 9.78757 4.08261 9.78725 3.97019C9.78725 3.18245 10.1002 2.42697 10.6572 1.86995C11.2142 1.31293 11.9697 1 12.7574 1C12.9927 1 13.1809 1.19067 13.1809 1.42467C13.1802 2.21177 12.8672 2.96642 12.3105 3.52287C11.7538 4.07932 10.999 4.39206 10.2119 4.39238V4.39362ZM16.4061 13.3277C16.5695 13.4503 16.6228 13.6744 16.5299 13.8564C15.038 16.8452 13.8457 18.3334 12.7574 18.3334C12.2511 18.3334 11.7533 18.1699 11.268 17.8505C10.9213 17.6222 10.5172 17.4963 10.1022 17.4873C9.6872 17.4783 9.27806 17.5866 8.92182 17.7997C8.33496 18.1514 7.7741 18.3334 7.24296 18.3334C5.64086 18.3334 3 13.4033 3 10.6968C3 7.80953 4.51419 5.60572 6.81829 5.60572C7.90163 5.60572 8.83763 5.76667 9.62382 6.08858C9.95687 6.22724 10.3332 6.21734 10.6589 6.06134C11.2965 5.75429 12.1372 5.60572 13.1821 5.60572C14.4573 5.60572 15.5667 6.24086 16.4903 7.47277C16.5579 7.56276 16.587 7.6759 16.5712 7.78733C16.5554 7.89876 16.496 7.99937 16.4061 8.06706C15.3748 8.83963 14.8783 9.70877 14.8783 10.6968C14.8783 11.686 15.3748 12.5539 16.4061 13.3277V13.3277Z"
                        stroke="white" stroke-width="1.6" />
                </svg>

                Apple</button>
        </div>

        <div class="line">
            <p class="line-label">Não possui conta?</p><a class="link" href="/auth/cadastro">Cadastre-se</a>
        </div>
        </div>
    </section>

    <script src="../static/js/components/icons.js"></script>
    <script src="../static/js/components/header.js"></script>
    <script src="../static/js/components/footer.js"></script>
    <script src="../static/js/pages/login.js"></script>
</body>

</html>
