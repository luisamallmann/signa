<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alterar Senha — SIGNA</title>

  <link rel="stylesheet" href="../static/css/global.css" />
  <link rel="stylesheet" href="../static/css/header.css" />
  <link rel="stylesheet" href="../static/css/footer.css" />
  <link rel="stylesheet" href="../static/css/configuracoes.css" />
  <link rel="stylesheet" href="../static/css/alterar.css" />

<body>

  <div id="app"></div>

  <main class="alterar-page">

    <section class="alterar-hero">
      <a href="configuracoes.html" class="priv-voltar">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <h1>Alterar Senha</h1>
      <p>Crie uma senha de fácil lembrança para você</p>
    </section>

    <section class="alterar-form">

      <div class="campo-grupo">
        <label>Email</label>
        <input type="email" placeholder="seu@email.com" />
      </div>

      <a href="verificar-codigo.html" class="btn-alterar">
        Enviar Código →
      </a>

      <div class="alterar-info">
        <p><strong>Não consegue verificar o email?</strong></p>
        <p>
          Se você não tem mais acesso ao email cadastrado, entre em contato com nosso suporte para recuperar o acesso à sua conta.
        </p>
      </div>

    </section>

  </main>

  <script src="../static/js/components/icons.js"></script>
  <script src="../static/js/components/header.js"></script>
  <script src="../static/js/components/footer.js"></script>
